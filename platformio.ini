; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
board_build.embed_files = data/cert/x509_crt_bundle.bin
board_build.filesystem = littlefs
extra_scripts = pre:tools/firmware_version.py
lib_deps =
	SPI
	arduino-libraries/NTPClient
	https://github.com/tzapu/WiFiManager
	bblanchon/ArduinoJson
	adafruit/Adafruit Unified Sensor
	adafruit/DHT sensor library
	adafruit/Adafruit BMP085 Library
	adafruit/Adafruit BMP280 Library
	adafruit/Adafruit BME280 Library
	adafruit/Adafruit CCS811 Library
	claws/BH1750
	sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library

[env:esp32dev]
board = esp32dev
; Board name must match the release filename (agrumy-<board>-v<version>.bin) and the config-poll heartbeat Board field.
build_flags = -D AGRUMY_BOARD=\"esp32dev\"
; Classic ESP32-WROOM has no built-in USB-JTAG; esp-builtin upload protocol fails on it.
upload_protocol = esptool
upload_port = COM6
; Stock default.csv left the app0/app1 OTA slots at 94%+ full with ~72KB spare while LittleFS sat
; over 98% empty - see partitions-512k-littlefs.csv for the exact split and the capacity math.
board_build.partitions = partitions-512k-littlefs.csv
test_ignore = test_native_*

[env:esp32s3usbotg]
board = esp32s3usbotg
board_build.mcu = esp32s3
build_flags = -D AGRUMY_BOARD=\"esp32s3usbotg\"
upload_port = COM5
test_ignore = test_native_*

; KC868-A6's six relays sit behind a PCF8574 I2C expander, not direct GPIO (see DeviceModel.h/RelayIO.h). Pin/I2C values are not physically verified on this project's hardware.
; No upload_port: set it locally in platformio_override.ini (gitignored) when flashing a real unit.
[env:kc868-a6]
board = esp32dev
build_flags =
	-D AGRUMY_BOARD=\"kc868-a6\"
	-D AGRUMY_KIT=\"KC868-A6\"
	-D AGRUMY_KIT_KC868_A6
upload_protocol = esptool
; Same board = esp32dev as [env:esp32dev] above, same flash-space problem, same fix.
board_build.partitions = partitions-512k-littlefs.csv
test_ignore = test_native_*

; Waveshare ESP32-S3-Relay-6CH: six relays on direct GPIO (1/2/41/42/45/46), not physically verified on this project's hardware.
[env:esp32-s3-relay-6ch]
board = esp32s3usbotg
board_build.mcu = esp32s3
build_flags =
	-D AGRUMY_BOARD=\"esp32-s3-relay-6ch\"
	-D AGRUMY_KIT=\"ESP32-S3-Relay-6CH\"
	-D AGRUMY_KIT_ESP32S3_RELAY6CH
test_ignore = test_native_*

; Host-based tests for the pure decision logic (no ESP32 hardware needed); framework/lib_deps are
; cleared because the Arduino-only libs inherited from [env] don't exist for a native build.
[env:native]
platform = native
framework =
lib_deps =
; PlatformIO skips building src/ into the test binary by default; without this RelayLogic/BatteryLogic never get linked in.
test_build_src = yes
; Unity's double asserts (TEST_ASSERT_EQUAL_DOUBLE etc.) are compiled out by default.
build_flags = -std=c++17 -D UNITY_INCLUDE_DOUBLE
; -<*> excludes the rest of src/ first, since main.cpp and Controller/*.cpp depend on Arduino.h/WiFi.h which don't exist on native.
build_src_filter = -<*> +<Logic/RelayLogic.cpp> +<Logic/BatteryLogic.cpp>
test_ignore = test_embedded_*
