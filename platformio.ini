; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; Shared by every environment - the per-env sections below carry only what actually differs
; (board, upload port/protocol, debug tooling), so a new library dependency is added once here
; instead of three times.
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
board_build.embed_files = data/cert/x509_crt_bundle.bin
board_build.filesystem = littlefs
; Roadmap #94: FIRMWARE_VERSION define derived from the git tag / FIRMWARE_VERSION env var at
; build time (see tools/firmware_version.py) - never hand-maintained in main.cpp again.
extra_scripts = pre:tools/firmware_version.py
lib_deps =
	SPI
	arduino-libraries/NTPClient
	https://github.com/tzapu/WiFiManager
	bblanchon/ArduinoJson
	adafruit/Adafruit Unified Sensor
	adafruit/DHT sensor library
	adafruit/Adafruit BMP085 Library
	adafruit/Adafruit BMP280 Library
	adafruit/Adafruit BME280 Library
	adafruit/Adafruit CCS811 Library
	claws/BH1750
	; Roadmap #12: MAX17048 fuel gauge (I2C, coulomb counting) - the RECOMMENDED battery sensor
	; option, VoltageDivider (analog, no extra library) remains the fallback/necessity path.
	sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library

[env:esp32dev]
board = esp32dev
; Roadmap #94: the board name the firmware reports in its config-poll heartbeat (Board) and the
; <board> part of the release file name agrumy-<board>-v<version>.bin - MUST equal this env's
; name, that is the whole contract between release.yml, the API catalog and OTA.
build_flags = -D AGRUMY_BOARD=\"esp32dev\"
; Classic ESP32-WROOM has no built-in USB-JTAG (that is an S3/C3 feature) - the previous
; esp-builtin value made every upload fail; serial esptool via the USB-UART bridge is correct.
upload_protocol = esptool
upload_port = COM6
; Roadmap #19/#95: this env only ever builds/runs the on-device Unity tests, never the host-only
; ones - the reverse exclusion is in [env:native] below.
test_ignore = test_native_*

[env:esp32s3usbotg]
board = esp32s3usbotg
board_build.mcu = esp32s3
build_flags = -D AGRUMY_BOARD=\"esp32s3usbotg\"
upload_port = COM5
test_ignore = test_native_*

; Roadmap #19/#95: host-based tests for the pure relay-decision logic (src/Logic/RelayLogic.*) -
; no ESP32 hardware needed, so this is the fast regression brake that runs on every push/PR
; (.github/workflows/build.yml) instead of waiting for a physical device. The shared [env] section
; above still applies to this env too (PlatformIO always merges it in) - framework/lib_deps are
; explicitly cleared here because the Arduino framework and its ESP32-only libraries (WiFiManager,
; NTPClient, the sensor libs) neither exist for nor are needed by a host build; leaving them
; inherited made `pio test -e native` try to install every one of them and then fail with "Please
; specify `board`" (framework=arduino requires a board, which a native platform has none of).
; build_src_filter keeps the native build from trying to compile the rest of src/ (main.cpp and
; every Controller/*.cpp depend on Arduino.h/WiFi.h/etc., none of which exist outside the esp32
; toolchain) - only the dependency-free logic file actually gets built here, alongside
; test/test_native_*/*.cpp (one directory per suite - PlatformIO links every Unity test file within
; a test directory into ONE program, and each of our three logic tests brings its own main(), so
; they must live in separate test_native_-prefixed directories rather than sharing one).
[env:native]
platform = native
framework =
lib_deps =
; PlatformIO skips building src/ into a test binary by default (assumes a self-contained test) -
; without this, build_src_filter below has nothing to act on and RelayLogic.cpp never gets linked
; in at all (silently - it shows up as "undefined reference", not a missing-filter warning).
test_build_src = yes
; Roadmap #12: test_native_battery_logic asserts on doubles (TEST_ASSERT_EQUAL_DOUBLE/
; TEST_ASSERT_DOUBLE_WITHIN) - Unity's double support is compiled out by default.
build_flags = -std=c++17 -D UNITY_INCLUDE_DOUBLE
; -<*> first: without it, PlatformIO's default "include everything under src/" would still try
; (and fail) to compile main.cpp and every Arduino-dependent Controller/*.cpp alongside the one
; file this env actually needs.
build_src_filter = -<*> +<Logic/RelayLogic.cpp> +<Logic/BatteryLogic.cpp>
test_ignore = test_embedded_*
