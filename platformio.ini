; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; To update Espressif32 librart → Update or, PlatformIO Core CLI → pio pkg update -g -p espressif32

[env:esp32dev]
platform = espressif32
board = esp32dev

; other params
framework = arduino
upload_protocol = esp-builtin
upload_port = COM3
monitor_speed = 115200
lib_ldf_mode = deep+ ; needed for WifiManager
; Root CA bundle for WiFiClientSecure::setCACertBundle() - see Korak 3 in ServiceController.cpp.
; Generated from ESP-IDF's cacrt_all.pem + cmn_crt_authorities.csv, plus ISRG Root X1 added
; explicitly (Let's Encrypt's actual current root; the curated common-authorities list only has
; the expired DST Root CA X3 cross-sign). Regenerate with gen_crt_bundle.py if it needs updating.
board_build.embed_files = data/cert/x509_crt_bundle.bin
lib_deps = 
	SPI
	arduino-libraries/NTPClient
    https://github.com/tzapu/WiFiManager
    arduino-libraries/NTPClient
    bblanchon/ArduinoJson
    adafruit/Adafruit Unified Sensor
    adafruit/DHT sensor library
    adafruit/Adafruit BMP085 Library
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit CCS811 Library
    claws/BH1750


[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3

; other params
framework = arduino
; Seeed XIAO ESP32-C3 is flashed over its USB-C port (default esptool), not JTAG -
; no upload_protocol/upload_port pinned here. Console is USB-CDC (the board
; definition sets ARDUINO_USB_CDC_ON_BOOT=1), which frees UART0 GPIO20/21 for use
; as GPIO - see the C3 branch of struct ConfigPin in src/Model/DeviceModel.h.
monitor_speed = 115200
lib_ldf_mode = deep+ ; needed for WifiManager
; Root CA bundle for WiFiClientSecure::setCACertBundle() - see esp32dev env above for how it's built.
board_build.embed_files = data/cert/x509_crt_bundle.bin
lib_deps =
	SPI
	arduino-libraries/NTPClient
    https://github.com/tzapu/WiFiManager
    arduino-libraries/NTPClient
    bblanchon/ArduinoJson
    adafruit/Adafruit Unified Sensor
    adafruit/DHT sensor library
    adafruit/Adafruit BMP085 Library
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit CCS811 Library
    claws/BH1750


