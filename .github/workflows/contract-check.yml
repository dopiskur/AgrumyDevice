name: Contract check

# Validates the hand-maintained firmware field lists in tools/contract-check/
# against the copied JSON Schemas in contracts/device-api/ (roadmap #5).
#
# Kept as its own workflow (separate from the PlatformIO build) so it stays
# fast and does not conflict-merge with build.yml.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      # Roadmap #121: SHA-pinned (same practice as release.yml/build.yml) - a moving major tag
      # could be repointed at anything; the pinned commit is exactly what was reviewed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - run: pip install -r tools/contract-check/requirements.txt
      - run: python tools/contract-check/check_contract.py
